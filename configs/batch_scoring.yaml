pipeline:
  current_dir: "artifacts/current"

data_ingestion:
  source: "parquet"
  parquet_path: "artifacts/runs/run_20260427_175142/data_ingestion/raw_data.parquet"
  mongodb:
    uri_env_var: "MONGODB_URI"
    database_env_var: "MONGODB_DATABASE"
    collection_env_var: "MONGODB_COLLECTION_ROULETTE_REPORT"
    strategy: "date_window"
    strategy_params:
      timestamp_field: "trans_date"
      lookback_days: 7
      start_date: null
      end_date: null
      confirm_full_pull: false

data_validation:
  fraud_csv_path: "ROULET CHEATING DATA.csv"

batch_scoring:
  source: "mongodb"
  mode: "operational"
  require_labels: false
  window:
    timestamp_field: "trans_date"
    lookback_days: 7
    start_date: null
    end_date: null

partnership:
  use_candidate_store: true
  candidate_store_path: "data_store/candidate_draws"
  candidate_window:
    start_date: 2026-02-25
    end_date: 2026-05-05
  pair_rules:
    strict_min_ratio_similarity: 0.80
    strict_min_pair_net_per_stake: -0.10
    nearmiss_min_union: 36
    nearmiss_max_overlap: 3
    nearmiss_min_ratio_similarity: 0.70
    nearmiss_min_pair_net_per_stake: -0.15
    nearmiss_require_different_ccs: true
    min_total_bet_amount: 1000.0
    stage1_flag_threshold: 0.70
  ccs_features:
    enabled: true
    profit_path: "data_store/ccs_daily_profit"
    windows_days: [1, 7]
    concentration_threshold: 0.70
  analyst_label_overlay:
    enabled: true
    require_both_members_for_pair_override: true
    conflict_policy: "no_override"

partnership_scoring:
  stage2_alert_threshold: 0.65
  backfill_lookback_days: 30

live_predictions_mongo:
  uri_env_var: "MONGODB_URI"
  database_env_var: "MONGODB_DATABASE"
  live_predictions_collection_env_var: "LIVE_PREDICTIONS_COLLECTION"
  analyst_labels_collection_env_var: "ANALYST_LABELS_COLLECTION"
  live_scoring_state_collection_env_var: "LIVE_SCORING_STATE_COLLECTION"
