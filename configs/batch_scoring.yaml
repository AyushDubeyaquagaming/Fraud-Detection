pipeline:
  current_dir: "artifacts/current"

data_ingestion:
  source: "parquet"
  parquet_path: "artifacts/runs/run_20260427_175142/data_ingestion/raw_data.parquet"
  mongodb:
    uri_env_var: "MONGODB_URI"
    database_env_var: "MONGODB_DATABASE"
    collection_env_var: "MONGODB_COLLECTION_ROULETTE_REPORT"
    strategy: "date_window"
    strategy_params:
      timestamp_field: "trans_date"
      lookback_days: 7
      start_date: null
      end_date: null
      confirm_full_pull: false

data_validation:
  fraud_csv_path: "ROULET CHEATING DATA.csv"

batch_scoring:
  source: "mongodb"
  mode: "operational"
  require_labels: false
  window:
    timestamp_field: "trans_date"
    lookback_days: 7
    chunk_days: 1
    start_date: null
    end_date: null

partnership:
  use_candidate_store: true
  candidate_store_path: "data_store/candidate_draws"
  short_rolling_windows: [1, 3]
  synthetic_positives_from_strict_pattern: false
  strict_inference_filter: false
  candidate_window:
    start_date: 2026-02-25
    end_date: 2026-05-05
  pair_rules:
    strict_min_ratio_similarity: 0.80
    strict_min_stake_ratio: 0.90
    strict_max_overlap_count: 2
    strict_min_pair_net_per_stake: -0.10
    nearmiss_min_union: 36
    nearmiss_max_overlap: 3
    nearmiss_min_ratio_similarity: 0.70
    nearmiss_min_pair_net_per_stake: -0.15
    nearmiss_require_different_ccs: true
    min_total_bet_amount: 1000.0
    min_pair_total_bet_amount: 0.0
    stage1_flag_threshold: 0.70
    strict_inference_filter: false
  clique_rules:
    min_group_size: 3
    max_group_size: 4
    min_union_count: 34
    strict_union_count: 36
    max_duplicate_position_count: 2
    min_member_coverage_count: 2
    max_member_coverage_count: 24
    min_member_stake: 1000.0
    min_group_total_stake: 30000.0
    min_avg_amount_ratio: 0.80
    min_total_stake_ratio: 0.90
    require_same_ccs: true
    max_candidates_per_ccs: 16
    stage1_flag_threshold: 0.70
    section_team_enabled: true
    min_section_team_clusters: 3
    min_section_team_distinct_ccs: 3
    min_section_team_union_count: 36
    min_duplicate_cluster_members: 3
    max_section_team_clusters: 8
  ccs_features:
    enabled: true
    profit_path: "data_store/ccs_daily_profit"
    windows_days: [1, 7]
    concentration_threshold: 0.70
partnership_scoring:
  stage2_alert_threshold: 0.65
  backfill_lookback_days: 30

live_predictions_mongo:
  uri_env_var: "MONGODB_URI"
  database_env_var: "MONGODB_DATABASE"
  live_predictions_collection_env_var: "LIVE_PREDICTIONS_COLLECTION"
  live_scoring_state_collection_env_var: "LIVE_SCORING_STATE_COLLECTION"

native_feedback:
  enabled: true
  api_base_url_env_var: "GK_BACKEND_API_BASE_URL"
  suspicious_bulk_path: "/gk-users/suspicious/bulk"
  request_timeout_seconds: 30
  uri_env_var: "MONGODB_URI"
  database_env_var: "MONGODB_DATABASE"
  users_collection_env_var: "MONGODB_COLLECTION_USERS"
  users_suspected_field: "suspected_fraud"
  confirmed_field: "confirmed_fraud"
  confirmed_fraud_weight: 2.0
  confirmed_not_fraud_weight: 2.0
