pipeline:
  artifact_root: "artifacts"
  current_dir: "artifacts/current"
  random_seed: 42
  weekly_serving_snapshot_config: "configs/batch_scoring.yaml"

data_ingestion:
  source: "parquet"
  parquet_path: "artifacts/runs/run_20260427_175142/data_ingestion/raw_data.parquet"
  mongodb:
    uri_env_var: "MONGODB_URI"
    database_env_var: "MONGODB_DATABASE"
    collection_env_var: "MONGODB_COLLECTION_ROULETTE_REPORT"
    strategy: "date_window"
    strategy_params:
      timestamp_field: "trans_date"
      lookback_days: 90
      start_date: null
      end_date: null
      confirm_full_pull: false
      store_root: "data_store/training_window"
      days_to_pull: 7

data_validation:
  required_columns:
    - member_id
    - draw_id
    - total_bet_amount
    - win_points
    - bets
  min_row_count: 1000
  fraud_csv_path: "ROULET CHEATING DATA.csv"

model_evaluation:
  min_capture_rate_top_5pct: 0.50
  min_lift_top_5pct: 4.0

mlflow:
  tracking_uri_env_var: "MLFLOW_TRACKING_URI"
  experiment_name: "fraud_detection_partnership_v1"
  registered_model_name: "fraud_detection_partnership_v1"
  register_on_promotion: true
  archive_existing_staging: true
  auto_promote_to_production: false

serving:
  artifact_provider: "local_disk"
  current_dir: "artifacts/current"
  manifest_file: "serving_manifest.json"
  model_version: "partnership_v1"
  host: "127.0.0.1"
  port: 8000

live_scoring:
  timestamp_field: "trans_date"
  settle_lag_seconds: 60
  initial_lookback_seconds: 3600
  max_draws_per_run: 200
  stage1_history_days: 7

partnership:
  candidate_thresholds:
    min_position_count: 4
    max_position_count: 34
    max_candidates_per_draw: 80
    max_jaccard: 0.10
    expandable_pair_min_coverage: 0.50
  rolling_window_days: 7
  label_tier_weights: { gold: 1.0, silver: 1.0, bronze: 0.5, gold_analyst: 1.0 }
  section_a_min_recurrence: 3
  section_b_min_stake: 1000.0
  section_b_min_per_position_ratio: 0.80
  section_b_max_combined_bet_cv: 0.35
  section_b_min_pair_net: 0.0

monitoring:
  enabled: true
  reports_dir: "monitoring"
  sample_size: 50000
  reference_from_current_metadata: true
  monitored_features:
    - max_stage1_score
    - mean_stage1_score
    - n_draws_stage1_above_0p5
    - n_draws_stage1_above_0p9
    - longest_consecutive_high_stage1_streak
    - n_distinct_high_score_partners
    - best_partnership_union_coverage
    - max_partnership_recurrence
    - min_partner_jaccard
    - pct_draws_in_persistent_partnership
    - distinct_persistent_partner_count
    - persistent_partnership_count
    - best_partnership_size
    - partnership_stake_share
  drift_threshold: 0.3
