name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit Tests And Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHON_VERSION: "3.10"
      IMAGE_NAME: fraud-detection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/unit -q

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Smoke test FastAPI container
        run: |
          docker run -d --name fraud-api-smoke -p 8000:8000 "${IMAGE_NAME}:${GITHUB_SHA}" serve
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs fraud-api-smoke
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f fraud-api-smoke || true
