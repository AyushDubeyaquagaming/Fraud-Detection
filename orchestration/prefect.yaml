# Prefect deployment spec for the fraud detection pipeline.
#
# This is a self-hosted Prefect setup — NOT Prefect Cloud.
#
# Bring-up (one-shot):
#   1. docker compose up -d                              # starts prefect-server, prefect-postgres, prefect-worker
#   2. export PREFECT_API_URL=http://localhost:4200/api  # point CLI at the local server
#      (PowerShell: $env:PREFECT_API_URL = "http://localhost:4200/api")
#   3. prefect deploy --prefect-file orchestration/prefect.yaml --all
#
# Inside the docker network, services use http://prefect-server:4200/api .
# From the host (CLI / scripts), use http://localhost:4200/api .
#
# Once deployed, the prefect-worker container picks up scheduled runs from
# the `fraud-pool` work pool. Open http://localhost:4200 to see the UI.

name: fraud-detection

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: full-cycle-weekly
    flow_name: fraud-detection-full-cycle
    entrypoint: orchestration/flows/full_cycle_flow.py:full_cycle_flow
    description: "Weekly candidate refresh, CCS refresh, training, promotion, and batch scoring"
    parameters:
      config_path: "configs/config.yaml"
      candidate_config_path: "configs/candidate_extraction.yaml"
      ccs_config_path: "configs/ccs_profit.yaml"
    schedules:
      - cron: "0 1 * * 1"       # every Monday at 01:00 UTC
        timezone: UTC
        active: true
    work_pool:
      name: fraud-pool
      work_queue_name: default
    tags:
      - fraud-detection
      - full-cycle

  - name: training-weekly
    flow_name: fraud-detection-training
    entrypoint: orchestration/flows/training_flow.py:training_flow
    description: "Training-only wrapper retained for manual/component runs; full-cycle-weekly is the scheduled production path"
    parameters:
      config_path: "configs/config.yaml"
    schedules:
      - cron: "0 2 * * 1"       # every Monday at 02:00 UTC
        timezone: UTC
        active: false
    work_pool:
      name: fraud-pool
      work_queue_name: default
    tags:
      - fraud-detection
      - training

  - name: batch-scoring-daily
    flow_name: fraud-detection-batch-scoring
    entrypoint: orchestration/flows/batch_scoring_flow.py:batch_scoring_flow
    description: "Daily batch scoring against the promoted model bundle"
    parameters:
      config_path: "configs/batch_scoring.yaml"
    schedules:
      - cron: "0 4 * * *"       # every day at 04:00 UTC
        timezone: UTC
        active: true
    work_pool:
      name: fraud-pool
      work_queue_name: default
    tags:
      - fraud-detection
      - scoring

  - name: live-scoring-poll
    flow_name: fraud-detection-live-scoring
    entrypoint: orchestration/flows/live_scoring_flow.py:live_scoring_flow
    description: "Poll Mongo for completed draws and upsert partnership live predictions"
    parameters:
      config_path: "configs/config.yaml"
    schedules:
      - interval: 60
        active: false
    work_pool:
      name: fraud-pool
      work_queue_name: default
    tags:
      - fraud-detection
      - live-scoring
