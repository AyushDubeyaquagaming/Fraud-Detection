# Self-hosted MLOps stack for fraud detection.
#
# Services:
#   - fraud-detection-api      FastAPI serving layer (v1 + live + historical scoring)
#   - fraud-detection          One-shot training image (run with `docker compose run --rm fraud-detection`)
#   - mlflow-server            MLflow tracking + Model Registry (SQLite-backed; survives restarts via volume)
#   - prefect-postgres         Postgres for the Prefect orchestration DB (state, schedules, history)
#   - prefect-server           Self-hosted Prefect server (NOT Prefect Cloud)
#   - prefect-worker           Process worker that picks up flow runs from `fraud-pool`
#
# Bring it all up: `docker compose up -d`
# Initial deploy of flows (one-time, host-side):
#   PREFECT_API_URL=http://localhost:4200/api prefect deploy --prefect-file orchestration/prefect.yaml

networks:
  fraud-net:
    driver: bridge

volumes:
  mlflow-data:
  prefect-pg-data:

services:
  fraud-detection-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-detection:local
    command: ["serve"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    networks: [fraud-net]
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    depends_on:
      - mlflow-server
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fraud-detection:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-detection:local
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    networks: [fraud-net]
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./data_cache:/app/data_cache
      - ./configs:/app/configs:ro
    depends_on:
      - mlflow-server
    command: train

  # ─────────────────────────────────────────────────────────────────────────
  # MLflow tracking + Model Registry (SQLite-backed for now; switch the
  # backend-store-uri to postgresql://... when scale or concurrency demands).
  # The registry REQUIRES a database-backed store — file:// cannot host
  # registered models, which is why we run the dedicated server.
  # ─────────────────────────────────────────────────────────────────────────
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    networks: [fraud-net]
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Prefect orchestration (self-hosted, NOT Prefect Cloud).
  # Postgres holds flow run state, schedules, and history. SQLite is fine
  # for laptop dev but breaks under any meaningful concurrency, so we use
  # Postgres from the start to make the eventual production cutover trivial.
  # ─────────────────────────────────────────────────────────────────────────
  prefect-postgres:
    image: postgres:15-alpine
    networks: [fraud-net]
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    volumes:
      - prefect-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:2-python3.11
    networks: [fraud-net]
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_UI_API_URL=http://localhost:4200/api
    depends_on:
      prefect-postgres:
        condition: service_healthy
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-detection:local
    networks: [fraud-net]
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_POOL_NAME=fraud-pool
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - PYTHONPATH=/app/src:/app
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./data_cache:/app/data_cache
      - ./configs:/app/configs:ro
      - ./orchestration:/app/orchestration:ro
      - ./src:/app/src:ro
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow-server:
        condition: service_started
    command: ["worker"]
    restart: unless-stopped
